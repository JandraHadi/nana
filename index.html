<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>buat nana ❤️</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #fce4ec 100%);
        font-family: "Poppins", "Segoe UI", sans-serif;
        overflow: hidden;
        position: fixed;
      }

      /* Floating Flowers Background Layer (CSS) */
      .bg-flowers-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .floating-flower-item {
        position: absolute;
        user-select: none;
        pointer-events: none;
        animation: floatFlower linear infinite;
        opacity: 0.75;
        filter: drop-shadow(0 4px 8px rgba(255, 105, 180, 0.3));
      }

      @keyframes floatFlower {
        0% {
          transform: translateY(105vh) rotate(0deg) scale(0.8);
          opacity: 0;
        }
        10% {
          opacity: 0.85;
        }
        90% {
          opacity: 0.85;
        }
        100% {
          transform: translateY(-10vh) rotate(360deg) scale(1.1);
          opacity: 0;
        }
      }

      .intro-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at center,
          #fff5f8 0%,
          #ffe4ea 50%,
          #fcc2d7 100%
        );
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 1000;
        transition:
          opacity 1s ease,
          visibility 1s ease;
      }

      .intro-screen.hide {
        opacity: 0;
        visibility: hidden;
      }

      .gift-btn {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 2px solid rgba(255, 105, 180, 0.7);
        border-radius: 60px;
        padding: clamp(16px, 3vh, 24px) clamp(24px, 5vw, 55px);
        text-align: center;
        cursor: pointer;
        transition: all 0.4s ease;
        animation: btnGlow 2.5s infinite;
        box-shadow: 0 10px 35px rgba(255, 105, 180, 0.35);
        position: relative;
        z-index: 10;
        max-width: min(92vw, 480px);
        width: fit-content;
      }

      @keyframes btnGlow {
        0%,
        100% {
          border-color: rgba(255, 105, 180, 0.6);
          box-shadow: 0 10px 30px rgba(255, 105, 180, 0.35);
        }
        50% {
          border-color: rgba(255, 20, 147, 0.9);
          box-shadow: 0 15px 45px rgba(255, 20, 147, 0.5);
        }
      }

      .gift-btn:hover {
        transform: scale(1.04);
        border-color: #ff1493;
        background: rgba(255, 255, 255, 0.95);
      }

      .gift-btn-text {
        font-size: clamp(1rem, 4.2vw, 1.4rem);
        font-weight: 600;
        color: #d81b60;
        letter-spacing: 1.5px;
        line-height: 1.35;
        text-shadow: 0 2px 10px rgba(255, 182, 193, 0.6);
        word-break: break-word;
      }

      .gift-btn-sub {
        font-size: clamp(0.68rem, 2.5vw, 0.75rem);
        color: #ad1457;
        margin-top: 8px;
        letter-spacing: 2px;
        font-weight: 500;
      }

      .canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #fcd5ce 100%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 1.2s ease;
        z-index: 900;
      }

      .canvas-container.show {
        opacity: 1;
        visibility: visible;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
      }

      /* Photo Frames (Kiri & Kanan) */
      .photo-frame {
        position: fixed;
        top: 50%;
        z-index: 950;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
      }

      .photo-left {
        left: 45px;
        transform: translateY(-50%) rotate(-5deg);
      }

      .photo-right {
        right: 45px;
        transform: translateY(-50%) rotate(5deg);
      }

      .photo-frame:hover {
        transform: translateY(-52%) scale(1.08) rotate(0deg);
        z-index: 990;
      }

      .photo-border {
        background: rgba(255, 255, 255, 0.95);
        padding: 10px 10px 32px 10px;
        border-radius: 20px;
        border: 3px solid #ff69b4;
        box-shadow:
          0 12px 30px rgba(255, 105, 180, 0.38),
          0 4px 10px rgba(0, 0, 0, 0.05);
        position: relative;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .photo-border::before {
        content: '🌸';
        position: absolute;
        top: -12px;
        right: -12px;
        font-size: 24px;
        filter: drop-shadow(0 2px 5px rgba(255, 105, 180, 0.5));
      }

      .photo-border::after {
        content: '💖';
        position: absolute;
        bottom: -10px;
        left: -10px;
        font-size: 22px;
        filter: drop-shadow(0 2px 5px rgba(255, 105, 180, 0.5));
      }

      .photo-border img {
        width: 160px;
        height: 210px;
        object-fit: cover;
        border-radius: 14px;
        display: block;
        border: 1px solid rgba(255, 105, 180, 0.3);
      }

      /* Love Message Di Tengah Love */
      .love-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        text-align: center;
        z-index: 960;
        opacity: 0;
        transition: opacity 0.8s ease, transform 0.8s ease;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: clamp(14px, 3vh, 22px) clamp(20px, 4vw, 36px);
        border-radius: 35px;
        border: 2px solid rgba(255, 105, 180, 0.75);
        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
        width: max-content;
        max-width: min(88vw, 420px);
      }

      .love-message.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .love-message h2 {
        color: #d81b60;
        font-size: clamp(1rem, 4.2vw, 1.5rem);
        font-weight: 700;
        letter-spacing: 2px;
        line-height: 1.3;
        text-shadow:
          0 0 20px rgba(255, 105, 180, 0.6),
          0 2px 4px rgba(255, 255, 255, 0.9);
      }

      .love-message p {
        color: #880e4f;
        font-size: clamp(0.68rem, 2.8vw, 0.82rem);
        margin-top: 6px;
        letter-spacing: 1px;
        font-weight: 500;
      }

      .status-indicator {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 8px 18px;
        border-radius: 50px;
        font-size: 0.75rem;
        color: #d81b60;
        z-index: 970;
        font-family: monospace;
        letter-spacing: 1px;
        pointer-events: none;
        border: 1.5px solid rgba(255, 105, 180, 0.5);
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
      }

      .now-playing {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 8px 18px;
        border-radius: 50px;
        font-size: 0.75rem;
        color: #d81b60;
        z-index: 970;
        border: 1.5px solid rgba(255, 105, 180, 0.5);
        pointer-events: none;
        animation: pulseText 2s infinite;
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
      }

      @keyframes pulseText {
        0%,
        100% {
          opacity: 0.8;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      .click-hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 8px 18px;
        border-radius: 50px;
        font-size: 0.7rem;
        color: #c2185b;
        z-index: 970;
        pointer-events: none;
        white-space: nowrap;
        border: 1px solid rgba(255, 105, 180, 0.4);
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.35);
      }

      /* Responsive Rules For Tablets & Mobile */
      @media (max-width: 900px) {
        .photo-left {
          left: 15px;
          top: 16%;
          transform: translateY(0) rotate(-4deg) scale(0.78);
          transform-origin: top left;
        }
        .photo-right {
          right: 15px;
          top: 16%;
          transform: translateY(0) rotate(4deg) scale(0.78);
          transform-origin: top right;
        }
        .photo-frame:hover {
          transform: scale(0.85) rotate(0deg);
        }
      }

      @media (max-width: 768px) {
        /* Pindahkan status-indicator ke kiri atas agar tidak menumpuk di bawah */
        .status-indicator {
          top: 15px;
          left: 15px;
          bottom: auto;
          font-size: 0.65rem;
          padding: 6px 14px;
        }

        /* Rapikan hint & player lagu di bawah tengah (tanpa bertumpuk) */
        .click-hint {
          bottom: 58px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 0.62rem;
          padding: 5px 14px;
          max-width: calc(100vw - 30px);
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .now-playing {
          bottom: 14px;
          right: auto;
          left: 50%;
          transform: translateX(-50%);
          font-size: 0.65rem;
          padding: 6px 16px;
          max-width: calc(100vw - 30px);
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          text-align: center;
        }
      }

      @media (max-width: 480px) {
        .photo-left {
          left: 6px;
          top: 12%;
          transform: translateY(0) rotate(-4deg) scale(0.6);
        }
        .photo-right {
          right: 6px;
          top: 12%;
          transform: translateY(0) rotate(4deg) scale(0.6);
        }
        .click-hint {
          bottom: 52px;
          font-size: 0.58rem;
          padding: 4px 12px;
        }
        .now-playing {
          bottom: 12px;
          font-size: 0.6rem;
          padding: 5px 12px;
        }
      }

      @media (max-width: 360px) {
        .photo-left {
          left: 2px;
          top: 10%;
          transform: translateY(0) rotate(-4deg) scale(0.52);
        }
        .photo-right {
          right: 2px;
          top: 10%;
          transform: translateY(0) rotate(4deg) scale(0.52);
        }
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Background Floating Flowers -->
    <div class="bg-flowers-container" id="bgFlowersContainer"></div>

    <div class="intro-screen" id="introScreen">
      <div class="gift-btn" id="giftBtn">
        <div class="gift-btn-text">🌸 loveee, aku ada hadiah buat kamu 🌸</div>
        <div class="gift-btn-sub">✦ click to open & play music ✦</div>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="loveCanvas"></canvas>

      <!-- Photo Frames (Kiri & Kanan) -->
      <div class="photo-frame photo-left">
        <div class="photo-border">
          <img
            src="photo/foto1.jpeg"
            alt="Foto Kiri"
            onerror="this.onerror=null; this.src='foto1.jpeg';"
          />
        </div>
      </div>

      <div class="photo-frame photo-right">
        <div class="photo-border">
          <img
            src="photo/foto2.jpeg"
            alt="Foto Kanan"
            onerror="this.onerror=null; this.src='foto2.jpeg';"
          />
        </div>
      </div>

      <!-- Love Message di tengah love -->
      <div class="love-message" id="loveMessage">
        <h2>💖 I LOVE YOU NANA 💖</h2>
        <p>"klik bunga-bunganya untuk kumpul & bubar"</p>
      </div>

      <div class="status-indicator" id="statusIndicator">🌸 MENUNGGU</div>
      <div class="click-hint" id="clickHint">
        ✨ klik canvas biar bunga-bunganya kumpul/bubar ✨
      </div>
      <div class="now-playing" id="nowPlaying">
        🎵 Kota Ini Tak Sama Tanpamu - Nadhif Basalamah
      </div>
    </div>

    <script>
      // ========== SPAWN FLOATING FLOWERS FOR BG ==========
      function createBackgroundFlowers() {
        const container = document.getElementById("bgFlowersContainer");
        const flowerIcons = ["🌸", "🌺", "🌷", "🌹", "🏵️", "🌸", "🌸", "✨"];
        const count = 35;

        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "floating-flower-item";
          el.innerHTML = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];
          el.style.left = Math.random() * 100 + "%";
          el.style.fontSize = Math.random() * 24 + 16 + "px";

          const duration = Math.random() * 12 + 10;
          const delay = Math.random() * 10;
          el.style.animationDuration = duration + "s";
          el.style.animationDelay = "-" + delay + "s";

          container.appendChild(el);
        }
      }
      createBackgroundFlowers();

      // ========== MUSIC PLAYER PAKAI MP3 KAMU ==========
      let audioPlayer = null;
      let musicStarted = false;

      function startMusic() {
        if (musicStarted) return;

        try {
          audioPlayer = new Audio("lagu.mp3");
          audioPlayer.loop = true;
          audioPlayer.volume = 0.8;

          const playPromise = audioPlayer.play();

          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                console.log("✅ Lagu berhasil diputar!");
                musicStarted = true;

                const nowPlaying = document.getElementById("nowPlaying");
                nowPlaying.innerHTML = "🎵 🎶 LAGU SEDANG DIPUTAR 🎶🎵";
                nowPlaying.style.animation = "pulseText 1s infinite";

                setTimeout(() => {
                  nowPlaying.innerHTML =
                    "🎵 Kota Ini Tak Sama Tanpamu - Nadhif Basalamah 🎵";
                }, 4000);
              })
              .catch((error) => {
                console.log("Autoplay gagal:", error);
                showManualPlayButton();
              });
          }
        } catch (e) {
          console.log("Error:", e);
          showManualPlayButton();
        }
      }

      function showManualPlayButton() {
        const btn = document.createElement("div");
        btn.innerHTML = "🔊 KLIK UNTUK PUTAR LAGU";
        btn.style.position = "fixed";
        btn.style.bottom = window.innerWidth <= 768 ? "95px" : "80px";
        btn.style.right = "20px";
        btn.style.background = "linear-gradient(135deg, #ff69b4, #d81b60)";
        btn.style.color = "white";
        btn.style.padding = "10px 22px";
        btn.style.borderRadius = "50px";
        btn.style.fontSize = "12px";
        btn.style.fontWeight = "bold";
        btn.style.cursor = "pointer";
        btn.style.zIndex = "1000";
        btn.style.boxShadow = "0 6px 20px rgba(255,105,180,0.5)";
        btn.style.animation = "pulseText 1s infinite";

        btn.onclick = function () {
          if (audioPlayer) {
            audioPlayer.play();
          } else {
            audioPlayer = new Audio("lagu.mp3");
            audioPlayer.loop = true;
            audioPlayer.volume = 0.8;
            audioPlayer.play();
          }
          musicStarted = true;
          btn.remove();

          const nowPlaying = document.getElementById("nowPlaying");
          nowPlaying.innerHTML = "🎵 🎶 LAGU SEDANG DIPUTAR 🎶🎵";
          setTimeout(() => {
            nowPlaying.innerHTML =
              "🎵 Kota Ini Tak Sama Tanpamu - Nadhif Basalamah 🎵";
          }, 4000);
        };

        document.body.appendChild(btn);

        setTimeout(() => {
          if (btn && btn.remove) btn.remove();
        }, 10000);
      }

      // ========== CANVAS LOVE & FLOWER PARTICLES ==========
      const canvas = document.getElementById("loveCanvas");
      const ctx = canvas.getContext("2d");

      let width, height;
      let particles = [];
      let bgPetals = [];
      let targetPositions = [];
      let randomPositions = [];
      let isForming = true;
      let animationStarted = false;
      let animationFrameId = null;
      let formationComplete = false;
      let autoBubarTimer = null;

      const statusIndicator = document.getElementById("statusIndicator");

      function updateStatus(text, isLove = false) {
        statusIndicator.innerHTML = isLove ? `💖 ${text} 💖` : `🌸 ${text} 🌸`;
        statusIndicator.style.color = isLove ? "#d81b60" : "#ad1457";
      }

      function generateHeartPoints() {
        const points = [];
        const pointCount = 2300;

        for (let i = 0; i < pointCount; i++) {
          const t = Math.random() * Math.PI * 2;
          let x = 16 * Math.pow(Math.sin(t), 3);
          let y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);
          const xOffset = (Math.random() - 0.5) * 1.0;
          const yOffset = (Math.random() - 0.5) * 1.0;
          x = x + xOffset;
          y = y + yOffset;
          points.push({ x, y });
        }
        return points;
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }

      // Floating Background Petal on Canvas
      class BackgroundPetal {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : -30;
          this.size = Math.random() * 12 + 8;
          this.speedY = Math.random() * 1.2 + 0.6;
          this.speedX = Math.sin(Math.random() * Math.PI) * 0.8;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.03;
          this.opacity = Math.random() * 0.5 + 0.35;
          const pinks = [
            "rgba(255, 182, 193, ",
            "rgba(255, 105, 180, ",
            "rgba(255, 192, 203, ",
            "rgba(244, 143, 177, ",
            "rgba(240, 98, 146, "
          ];
          this.colorBase = pinks[Math.floor(Math.random() * pinks.length)];
        }

        update() {
          this.y += this.speedY;
          this.x += Math.sin(this.y * 0.01) * 0.5 + this.speedX;
          this.rotation += this.rotationSpeed;
          if (this.y > height + 40 || this.x < -40 || this.x > width + 40) {
            this.reset(false);
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.fillStyle = this.colorBase + this.opacity + ")";
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(this.size, -this.size, this.size * 1.4, 0);
          ctx.quadraticCurveTo(this.size, this.size, 0, 0);
          ctx.fill();
          ctx.restore();
        }
      }

      class Particle {
        constructor(x, y, targetX, targetY, randomX, randomY, index) {
          this.x = x;
          this.y = y;
          this.targetLoveX = targetX;
          this.targetLoveY = targetY;
          this.targetRandomX = randomX;
          this.targetRandomY = randomY;
          this.currentTargetX = targetX;
          this.currentTargetY = targetY;
          this.size = Math.random() * 2.6 + 1.8;
          this.speed = 0.025 + Math.random() * 0.02;
          this.progress = 1;
          
          const hues = [330, 335, 340, 345, 350, 355];
          const hue = hues[Math.floor(Math.random() * hues.length)];
          const lightness = 55 + Math.random() * 20;
          this.color = `hsl(${hue}, 95%, ${lightness}%)`;
        }

        setTarget(isLoveMode) {
          if (isLoveMode) {
            this.currentTargetX = this.targetLoveX;
            this.currentTargetY = this.targetLoveY;
          } else {
            this.currentTargetX = this.targetRandomX;
            this.currentTargetY = this.targetRandomY;
          }
          this.progress = 0;
          this.startX = this.x;
          this.startY = this.y;
        }

        update() {
          if (this.progress >= 1) {
            this.x = this.currentTargetX;
            this.y = this.currentTargetY;
            return true;
          }
          this.progress += this.speed;
          if (this.progress >= 1) {
            this.x = this.currentTargetX;
            this.y = this.currentTargetY;
            return true;
          }
          const ease = 1 - Math.pow(1 - this.progress, 3);
          this.x = this.startX + (this.currentTargetX - this.startX) * ease;
          this.y = this.startY + (this.currentTargetY - this.startY) * ease;
          return false;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 6;
          ctx.shadowColor = "#ff69b4";
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function generateLoveTargets() {
        const points = generateHeartPoints();
        const centerX = width / 2;
        const centerY = height / 2;
        const scale = Math.min(width, height) / 32;
        return points.map((point) => ({
          x: centerX + point.x * scale,
          y: centerY - point.y * scale + 15,
        }));
      }

      function generateRandomTargets(count) {
        const targets = [];
        for (let i = 0; i < count; i++) {
          targets.push({
            x: Math.random() * (width + 200) - 100,
            y: Math.random() * (height + 200) - 100,
          });
        }
        return targets;
      }

      function createParticles(loveTargets, randomTargets) {
        particles = [];
        for (let i = 0; i < loveTargets.length; i++) {
          const loveTarget = loveTargets[i];
          const randomTarget = randomTargets[i];
          particles.push(
            new Particle(
              randomTarget.x,
              randomTarget.y,
              loveTarget.x,
              loveTarget.y,
              randomTarget.x,
              randomTarget.y,
              i,
            ),
          );
        }
      }

      function initBackgroundPetals() {
        bgPetals = [];
        for (let i = 0; i < 45; i++) {
          bgPetals.push(new BackgroundPetal());
        }
      }

      function formLove() {
        if (!animationStarted) return;
        if (autoBubarTimer) clearTimeout(autoBubarTimer);
        isForming = true;
        formationComplete = false;
        updateStatus("BERKUMPUL JADI LOVE 💖", false);
        document.getElementById("loveMessage").classList.remove("show");
        for (let particle of particles) particle.setTarget(true);
      }

      function disperse() {
        if (!animationStarted) return;
        isForming = false;
        formationComplete = false;
        updateStatus("BUBAR... 🌸", false);
        for (let particle of particles) particle.setTarget(false);
      }

      function toggleFormation() {
        if (!animationStarted) return;
        if (isForming) disperse();
        else formLove();
      }

      function animateParticles() {
        if (!animationStarted) return;
        ctx.clearRect(0, 0, width, height);

        const gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, "#fff0f5");
        gradient.addColorStop(0.5, "#ffe4e1");
        gradient.addColorStop(1, "#fcd5ce");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (let petal of bgPetals) {
          petal.update();
          petal.draw();
        }

        let allComplete = true;
        for (let particle of particles) {
          const completed = particle.update();
          if (!completed) allComplete = false;
          particle.draw();
        }

        if (allComplete && !formationComplete) {
          formationComplete = true;
          if (isForming) {
            updateStatus("LOVE TERBENTUK 💖", true);
            document.getElementById("loveMessage").classList.add("show");
            createCompletionEffect();
            autoBubarTimer = setTimeout(() => disperse(), 3500);
          } else {
            updateStatus("BUNGA BERSERAKAN 🌸", false);
            document.getElementById("loveMessage").classList.remove("show");
          }
        }
        animationFrameId = requestAnimationFrame(animateParticles);
      }

      function createCompletionEffect() {
        for (let i = 0; i < 45; i++) {
          setTimeout(() => {
            const sparkle = document.createElement("div");
            sparkle.innerHTML = ["🌸", "🌺", "💖", "✨", "🌷", "🌹"][
              Math.floor(Math.random() * 6)
            ];
            sparkle.style.position = "fixed";
            sparkle.style.left = Math.random() * window.innerWidth + "px";
            sparkle.style.bottom = "0px";
            sparkle.style.fontSize = Math.random() * 22 + 16 + "px";
            sparkle.style.animation = "floatUp 2.2s ease-out forwards";
            sparkle.style.pointerEvents = "none";
            sparkle.style.zIndex = "1000";
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 2200);
          }, i * 30);
        }
      }

      function initLoveSystem() {
        resizeCanvas();
        const loveTargets = generateLoveTargets();
        const randomTargets = generateRandomTargets(loveTargets.length);
        createParticles(loveTargets, randomTargets);
        initBackgroundPetals();
      }

      function startLoveSystem() {
        initLoveSystem();
        animationStarted = true;
        animateParticles();
        setTimeout(() => formLove(), 500);
      }

      function stopAnimation() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (autoBubarTimer) clearTimeout(autoBubarTimer);
      }

      let resizeTimeout;
      window.addEventListener("resize", () => {
        if (animationStarted) {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            const wasForming = isForming;
            stopAnimation();
            resizeCanvas();
            initLoveSystem();
            animationStarted = true;
            animateParticles();
            if (wasForming) setTimeout(() => formLove(), 100);
            else setTimeout(() => disperse(), 100);
          }, 200);
        }
      });

      const floatStyle = document.createElement("style");
      floatStyle.textContent = `@keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }`;
      document.head.appendChild(floatStyle);

      // ========== BUKA HADIAH ==========
      const introScreen = document.getElementById("introScreen");
      const canvasContainer = document.getElementById("canvasContainer");
      const giftBtn = document.getElementById("giftBtn");

      function openGift() {
        startMusic();

        introScreen.classList.add("hide");

        setTimeout(() => {
          canvasContainer.classList.add("show");
          startLoveSystem();
          createInitialSparkles();
        }, 500);
      }

      function createInitialSparkles() {
        for (let i = 0; i < 50; i++) {
          setTimeout(() => {
            const sparkle = document.createElement("div");
            sparkle.innerHTML = ["🌸", "✨", "🌷", "💖", "🌹", "🌺"][
              Math.floor(Math.random() * 6)
            ];
            sparkle.style.position = "fixed";
            sparkle.style.left = Math.random() * window.innerWidth + "px";
            sparkle.style.top = Math.random() * window.innerHeight + "px";
            sparkle.style.fontSize = Math.random() * 25 + 15 + "px";
            sparkle.style.opacity = "0";
            sparkle.style.animation = "sparklePop 0.8s ease-out forwards";
            sparkle.style.pointerEvents = "none";
            sparkle.style.zIndex = "1000";
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
          }, i * 30);
        }
      }

      const sparkleStyle = document.createElement("style");
      sparkleStyle.textContent = `@keyframes sparklePop { 0% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(0); } }`;
      document.head.appendChild(sparkleStyle);

      canvas.addEventListener("click", () => {
        if (animationStarted) {
          toggleFormation();
          canvas.style.transform = "scale(0.99)";
          setTimeout(() => {
            canvas.style.transform = "scale(1)";
          }, 150);
        }
      });

      giftBtn.addEventListener("click", openGift);

      console.log(
        "🌸 Taman Bunga Pink Siap! Musik akan diputar saat tombol diklik 🌸",
      );
    </script>
  </body>
</html>
